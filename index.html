<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaSoft - Sistema web de gestión de pedidos">
  <title>Gestión de Pedidos - NovaSoft</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Gestión de Pedidos</h1>
    <form id="form-pedido">
      <label for="cliente">Cliente</label>
      <input type="text" id="cliente" name="cliente" required>

      <label for="producto">Producto</label>
      <select id="producto" name="producto" required>
        <option value="Teclado">Teclado - $25.00</option>
        <option value="Mouse">Mouse - $12.50</option>
        <option value="Monitor">Monitor - $180.00</option>
      </select>

      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>

      <button type="submit" id="btn-agregar">Agregar pedido</button>
    </form>

    <section id="resultado"></section>
  </main>

  <script src="utils.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
